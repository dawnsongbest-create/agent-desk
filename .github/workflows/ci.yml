name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - name: Native macOS Keychain adapter round trip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test_keychain="$RUNNER_TEMP/agent-desk-tests.keychain-db"
          test_password="$(uuidgen)"
          security create-keychain -p "$test_password" "$test_keychain"
          trap 'security delete-keychain "$test_keychain"' EXIT
          security default-keychain -d user -s "$test_keychain"
          security unlock-keychain -p "$test_password" "$test_keychain"
          cargo test --manifest-path src-tauri/Cargo.toml os_credential_roundtrip -- --ignored
      - run: pnpm tauri build --no-bundle
